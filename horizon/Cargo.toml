[package]
name = "minelights-horizon"
version = "2.4.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false
description = "MineLights native mod for Horizon"

[lib]
path = "mixins/minelights/direct.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
minelights-engine = { path = "mixins/minelights/engine" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
