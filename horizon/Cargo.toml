[package]
name = "minelights-horizon"
# Cargo's SemVer accepts three numeric components; the published mod version is 2.3.8.5 in horizon-mixin.toml.
version = "2.3.8+5"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false
description = "MineLights native mod for Horizon"

[lib]
path = "mixins/minelights/direct.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
