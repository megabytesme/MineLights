[mod]
id = "minelights"
version = "0.1.2"
priority = 100

[compatibility]
  horizon_revision = "294448014fba585f8d5d09dd8886f482493b6417"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "minelights"
source = "runtime.rs"

[[module]]
id = "config"
file = "crates/horizon-client/src/game.rs"
name = "minelights_config"
source = "config.rs"

[[module]]
id = "effects"
file = "crates/horizon-client/src/game.rs"
name = "minelights_effects"
source = "effects.rs"

[[module]]
id = "player_data"
file = "crates/horizon-client/src/game.rs"
name = "minelights_player_data"
source = "player_data.rs"

[[module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "minelights_bridge"
source = "bridge.rs"

[[module]]
id = "server"
file = "crates/horizon-client/src/game.rs"
name = "minelights_server"
source = "server.rs"

[[module]]
id = "waypoint_access"
file = "crates/horizon-client/src/locator_bar.rs"
name = "minelights_access"
