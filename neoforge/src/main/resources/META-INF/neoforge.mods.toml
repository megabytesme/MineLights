modLoader = "javafml"
loaderVersion = "*"
issueTrackerURL = "https://github.com/megabytesme/MineLights/issues"
license = "CC BY-NC-SA 4.0"

[[mods]]
modId = "minelights"
version = "${version}"
displayName = "MineLights"
authors = "MegaBytesMe"
description = "MineLights brings RGB lighting integrations to Minecraft Java Edition."
iconFile = "assets/minelights/icon.png"
logoFile = "assets/minelights/icon.png"
mixins = "minelights.mixins.json"

[["dependencies.minelights"]]
modId = "neoforge"
type = "required"
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "CLIENT"

[["dependencies.minelights"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "minelights.mixins.json"
